<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinematic Scroll Demo</title>
    <link rel="stylesheet" href="style.css?v=0605-global-nav-images" />
  </head>
  <body>
    <svg class="svg-filters" xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="ripple">
        <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" result="turb" />
        <feDisplacementMap in2="turb" in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G" />
        <animate xlink:href="#turb" attributeName="baseFrequency" values="0.02 0.03;0.025 0.035;0.02 0.03" dur="6s" repeatCount="indefinite" />
      </filter>
    </svg>

    <div class="global-ui-layer" aria-label="Global UI">
      <img class="global-logo" src="assets/images/title_p1/top-left.png" alt="Lumière Studio" />

      <nav class="global-nav" aria-label="Global navigation">
        <button class="global-nav-button global-introduction-button" type="button" aria-label="Personal Introduction" data-modal-open="introModal">
          <img src="assets/images/buttons/buttons_p1/introduction.png" alt="Personal Introduction" />
        </button>

        <img class="global-nav-divider" src="assets/images/buttons/buttons_p1/dot.png" alt="" aria-hidden="true" />

        <button class="global-nav-button global-portfolio-button" type="button" aria-label="Portfolio" data-modal-open="portfolioModal">
          <img src="assets/images/buttons/buttons_p1/portfolio.png" alt="Portfolio" />
        </button>

        <img class="global-nav-divider" src="assets/images/buttons/buttons_p1/dot.png" alt="" aria-hidden="true" />

        <button class="global-nav-button global-mute-button" type="button" aria-label="Mute" aria-pressed="false">
          <img class="global-mute-img" src="assets/images/buttons/buttons_p1/mute_1.png" alt="Mute" />
        </button>
      </nav>

      <img class="global-scroll-down" src="assets/images/buttons/buttons_whole/scrolldown.png" alt="Scroll down" />
    </div>

    <main id="smooth-wrapper">
      <section class="page hero-page" id="page1" aria-label="Hero scene">
        <div class="hero-scene">
        </div>
      </section>

      <section class="page blank-page" id="page2" aria-label="Page 2">
      </section>

      <section class="page blank-page" id="page3" aria-label="Page 3">
      </section>

      <section class="page blank-page" id="page4" aria-label="Page 4">
      </section>

      <section class="page blank-page" id="page5" aria-label="Page 5">
      </section>

      <section class="page blank-page" id="page6" aria-label="Page 6">
      </section>
    </main>

    <div class="modal" id="introModal" role="dialog" aria-modal="true" aria-labelledby="introTitle" hidden>
      <div class="modal-panel">
        <button class="modal-close" data-modal-close aria-label="Close">x</button>
        <h2 id="introTitle">Personal Introduction</h2>
        <p>A compact cinematic demo profile space with layered 2D motion, portfolio entry points, and smooth scroll choreography.</p>
      </div>
    </div>

    <div class="modal" id="portfolioModal" role="dialog" aria-modal="true" aria-labelledby="portfolioTitle" hidden>
      <div class="modal-panel">
        <button class="modal-close" data-modal-close aria-label="Close">x</button>
        <h2 id="portfolioTitle">Portfolio</h2>
        <ul class="jump-list">
          <li><button data-jump="#page1">Page 1</button></li>
          <li><button data-jump="#page2">Page 2</button></li>
          <li><button data-jump="#page3">Page 3</button></li>
          <li><button data-jump="#page4">Page 4</button></li>
          <li><button data-jump="#page5">Page 5</button></li>
          <li><button data-jump="#page6">Page 6</button></li>
        </ul>
      </div>
    </div>

    <aside class="debug-panel" id="debugPanel">
      <div class="debug-head">
        <strong>Alignment</strong>
        <button class="debug-collapse" id="debugCollapse" type="button" aria-expanded="true" aria-controls="debugControls debugValues">−</button>
      </div>
      <div class="debug-controls" id="debugControls"></div>
      <pre id="debugValues"></pre>
    </aside>

    <script src="assets/vendor/lenis.min.js"></script>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/ScrollTrigger.min.js"></script>
    <script src="script.js?v=0605-global-nav-images"></script>
  </body>
</html>
