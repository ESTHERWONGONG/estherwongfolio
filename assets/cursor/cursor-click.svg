<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-click" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4.8" result="blur"></feGaussianBlur>
    </filter>
  </defs>

  <!-- pulse glow -->
  <circle cx="32" cy="32" r="20" fill="#9FE8FF" fill-opacity="0.12" filter="url(#glow-click)"></circle>

